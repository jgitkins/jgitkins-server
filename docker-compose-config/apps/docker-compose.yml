version: "3.9"

services:
  jgitkins-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ghcr.io/jgitkins/jgitkins-server:latest
    ports:
      - "18080:8084"
      - "19090:9090"
    env_file:
      - env.properties
#    environment:
    volumes:
      # - /opt/apps/jgitkins/server/bare:/opt/apps/jgitkins/server/bare
      - /opt/apps/jgitkins/bare:/opt/apps/jgitkins/bare
    networks:
      - jgitkins-net
    restart: unless-stopped

