name: jgitkins-server CI/CD

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".gitignore"
      - ".github/workflows/jgitkins-server.yml"
      - "docker-compose-config/apps/docker-compose.yml"


permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: jgitkins-server
  REGISTRY: ghcr.io
  COMPOSE_FILE: docker-compose-config/apps/docker-compose.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: echo '[DEBUG] Checkout Repository ...'
      - name: Checkout (git)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        run: echo '[DEBUG] Setup Docker Buildx ...'
      - name: Set up Docker Buildx (action)
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        run: echo '[DEBUG] Login GHCR ...'
      - name: Log in to GHCR (action)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: echo '[DEBUG] Building Application ...'
      - name: Build and push image (docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Upload docker-compose.yml
        run: echo '[DEBUG] Upload Manifest file(docker-compose.yml)'
      - name: Upload docker-compose.yml (scp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ${{ env.COMPOSE_FILE }}
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy to home server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN,REGISTRY
          script: |
            set -e
            export PATH=/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
            echo '[DEBUG] Deploy jgitkins-server ...'
            echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
            cd "${{ secrets.DEPLOY_PATH }}"
            docker-compose -f "${{ env.COMPOSE_FILE }}" pull jgitkins-server
            docker-compose -f "${{ env.COMPOSE_FILE }}" up -d --force-recreate jgitkins-server
            docker image prune -f
