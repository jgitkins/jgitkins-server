grpc:
  server:
    port: 9090
---

# 기본 설정
server:
  port: 8084
  servlet:
    context-path: /
---
# Mybatis 설정
mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
---
# Swagger 설정
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    display-request-duration: true
    persist-authorization: true
---
# import
spring:
  config:
    import: optional:classpath:env.properties

---
jgitkins:
  server:
    runtime:
      rest-host: localhost
      rest-port: ${server.port:8084}
      rest-base-path: /api
      grpc-host: localhost
      grpc-port: ${grpc.server.port:9090}
      poll-interval-ms: 5000
      busy-wait-interval-ms: 1000
      volumn: ${user.home}
  security:
    jwt:
      secret: ${JGITKINS_JWT_SECRET}
      ttl-seconds: ${JGITKINS_JWT_TTL:900}

---
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com
